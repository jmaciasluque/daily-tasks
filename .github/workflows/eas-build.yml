name: EAS Build (APK)

on:
  push:
    branches: ['**']
    tags: ['v*']  # Trigger on version tags like v1.0.0, v1.0.1, etc.
  workflow_dispatch:  # Allow manual trigger

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: mobile/package-lock.json

      - name: Setup Expo
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        working-directory: ./mobile
        run: npm ci

      - name: Set build environment
        run: |
          if [ "${{ github.ref_name }}" = "main" ]; then
            echo "APP_VARIANT=production" >> $GITHUB_ENV
            echo "APP_VERSION_SUFFIX=" >> $GITHUB_ENV
          else
            echo "APP_VARIANT=testing" >> $GITHUB_ENV
            echo "APP_VERSION_SUFFIX=${GITHUB_SHA}" >> $GITHUB_ENV
          fi

      - name: Build Android APK
        working-directory: ./mobile
        run: |
          if [ "${{ github.ref_name }}" = "main" ]; then
            APP_VARIANT=production APP_VERSION_SUFFIX=${APP_VERSION_SUFFIX} \
              eas build --platform android --profile preview --non-interactive
          else
            APP_VARIANT=testing APP_VERSION_SUFFIX=${APP_VERSION_SUFFIX} \
              eas build --platform android --profile testing --non-interactive --no-wait
          fi

      - name: Build Android App Bundle (Play Store)
        if: github.ref_name == 'main'
        working-directory: ./mobile
        run: eas build --platform android --profile production --non-interactive
