name: CLI Tests

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.24'
          cache-dependency-path: cli/go.sum

      - name: Read version
        id: version
        run: |
          VERSION="$(tr -d '[:space:]' < VERSION)"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Version: ${VERSION}"
          {
            echo "### Version"
            echo "${VERSION}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Run tests
        id: tests
        working-directory: ./cli
        run: |
          set -o pipefail

          set +e
          go test ./... -v -cover -coverprofile=coverage.out 2>&1 | tee test.log
          TEST_EXIT=${PIPESTATUS[0]}
          set -e

          PASSED="$(grep -cE -- '--- PASS:' test.log || true)"
          FAILED="$(grep -cE -- '--- FAIL:' test.log || true)"
          if [ "$TEST_EXIT" -ne 0 ] && [ "$FAILED" -eq 0 ]; then
            FAILED=1
          fi

          COVERAGE="unavailable"
          if [ -s coverage.out ]; then
            if go tool cover -func=coverage.out | tee coverage-summary.txt; then
              COVERAGE="$(awk '/^total:/ {print $3}' coverage-summary.txt)"
            else
              echo "::warning::Unable to parse coverage.out"
            fi
          else
            echo "::warning::coverage.out was not created"
          fi

          echo "Tests passed: ${PASSED}"
          echo "Tests failed: ${FAILED}"
          echo "Coverage: ${COVERAGE}"

          {
            echo "passed=${PASSED}"
            echo "failed=${FAILED}"
            echo "coverage=${COVERAGE}"
            echo "exit_code=${TEST_EXIT}"
          } >> "$GITHUB_OUTPUT"

          {
            echo "### CLI test summary"
            echo "- Tests: ${PASSED} passed, ${FAILED} failed"
            echo "- Coverage: ${COVERAGE}"
          } >> "$GITHUB_STEP_SUMMARY"

          exit "$TEST_EXIT"

      - name: Build
        working-directory: ./cli
        run: go build -o daily-tasks .

      - name: Comment PR summary
        if: ${{ always() && github.event_name == 'pull_request' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
          TESTS_PASSED: ${{ steps.tests.outputs.passed || '0' }}
          TESTS_FAILED: ${{ steps.tests.outputs.failed || '0' }}
          COVERAGE: ${{ steps.tests.outputs.coverage || 'unavailable' }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail

          RUN_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          COMMENTS_URL="${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments"
          COMMENT_MARKER="<!-- daily-tasks-cli-ci-summary -->"
          COMMENT_FILE="$(mktemp)"
          PAYLOAD_FILE="$(mktemp)"
          COMMENTS_FILE="$(mktemp)"

          cat > "$COMMENT_FILE" <<EOF
          ${COMMENT_MARKER}
          ## CLI CI Summary

          | Item | Result |
          | --- | --- |
          | Version | \`${VERSION}\` |
          | Tests | ${TESTS_PASSED} passed, ${TESTS_FAILED} failed |
          | Code coverage | ${COVERAGE} |
          | Workflow run | [View run](${RUN_URL}) |
          EOF

          jq -n --rawfile body "$COMMENT_FILE" '{body: $body}' > "$PAYLOAD_FILE"

          if ! curl -fsSL \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "${COMMENTS_URL}?per_page=100" > "$COMMENTS_FILE"; then
            echo "::warning::Unable to fetch existing PR comments. The token may not have permission to comment on this PR."
            exit 0
          fi

          COMMENT_ID="$(jq -r --arg marker "$COMMENT_MARKER" '.[] | select(.user.type == "Bot" and (.body | contains($marker))) | .id' "$COMMENTS_FILE" | head -n 1)"

          if [ -n "$COMMENT_ID" ]; then
            if ! curl -fsSL -X PATCH \
              -H "Authorization: Bearer ${GITHUB_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              -d @"$PAYLOAD_FILE" \
              "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/issues/comments/${COMMENT_ID}" > /dev/null; then
              echo "::warning::Unable to update PR comment. The token may not have permission to comment on this PR."
            fi
          elif ! curl -fsSL -X POST \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -d @"$PAYLOAD_FILE" \
            "$COMMENTS_URL" > /dev/null; then
            echo "::warning::Unable to create PR comment. The token may not have permission to comment on this PR."
          fi
