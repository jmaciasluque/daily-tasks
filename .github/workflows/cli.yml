name: CLI Tests

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Run tests
        working-directory: ./cli
        run: go test ./... -v -cover -coverprofile=coverage.out

      - name: Build
        working-directory: ./cli
        run: go build -o daily-tasks .
