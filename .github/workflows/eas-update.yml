name: EAS Update (OTA)

on:
  push:
    branches: ['main']
    paths:
      - 'mobile/**'
      - '!mobile/app.json'  # app.json changes need full rebuild

jobs:
  update:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: mobile/package-lock.json

      - name: Setup Expo
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        working-directory: ./mobile
        run: npm ci

      - name: Publish update
        working-directory: ./mobile
        run: APP_VARIANT=production eas update --branch production --message "${{ github.event.head_commit.message }}"
