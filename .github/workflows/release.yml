name: Release Android

# Tag vX.Y.Z (matching VERSION) to build the signed production AAB and upload
# it to the Play Console internal testing track. Promote from there in the
# Play Console.
#
# Required secrets:
#   ANDROID_UPLOAD_KEYSTORE_BASE64   base64 of the upload .jks
#   ANDROID_UPLOAD_KEYSTORE_PASSWORD
#   ANDROID_UPLOAD_KEY_ALIAS
#   ANDROID_UPLOAD_KEY_PASSWORD
#   PLAY_SERVICE_ACCOUNT_JSON        service account with release permissions
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  aab:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      APP_VARIANT: production
    steps:
      - uses: actions/checkout@v6
      - name: Tag matches VERSION
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          test "v$(tr -d '[:space:]' < VERSION)" = "${GITHUB_REF_NAME}" || {
            echo "::error::Tag ${GITHUB_REF_NAME} does not match VERSION $(cat VERSION)"; exit 1; }
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v5
      - name: Install dependencies
        working-directory: mobile
        run: npm ci
      - name: Tests
        working-directory: mobile
        run: npx jest && npx tsc --noEmit
      - name: Restore upload keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64" || { echo "::error::ANDROID_UPLOAD_KEYSTORE_BASE64 secret missing"; exit 1; }
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          echo "ANDROID_UPLOAD_KEYSTORE_FILE=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"
      - name: Generate native project
        working-directory: mobile
        run: npx expo prebuild --platform android --clean --no-install
      - name: Build signed AAB and APK
        working-directory: mobile/android
        env:
          ANDROID_UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_PASSWORD }}
          ANDROID_UPLOAD_KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
          ANDROID_UPLOAD_KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
        run: ./gradlew bundleRelease assembleRelease --no-daemon
      - uses: actions/upload-artifact@v5
        with:
          name: daily-tasks-${{ github.ref_name }}
          path: |
            mobile/android/app/build/outputs/bundle/release/app-release.aab
            mobile/android/app/build/outputs/apk/release/app-release.apk
      - name: Upload to Play internal testing
        if: env.PLAY_JSON != ''
        env:
          PLAY_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: be.maclug.dailytasks
          releaseFiles: mobile/android/app/build/outputs/bundle/release/app-release.aab
          track: internal
          status: completed
      - name: GitHub release with the APK
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp mobile/android/app/build/outputs/apk/release/app-release.apk "daily-tasks-${GITHUB_REF_NAME}.apk"
          gh release create "${GITHUB_REF_NAME}" "daily-tasks-${GITHUB_REF_NAME}.apk" --generate-notes
