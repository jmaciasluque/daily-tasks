# Go code for the CLI module. Run `make proto` from the repo root.
version: v2
managed:
  enabled: true
  override:
    - file_option: go_package_prefix
      value: daily-tasks/internal/gen
inputs:
  - directory: proto
plugins:
  - local: protoc-gen-go
    out: cli/internal/gen
    opt: paths=source_relative
  - local: protoc-gen-connect-go
    out: cli/internal/gen
    opt: paths=source_relative
clean: true
